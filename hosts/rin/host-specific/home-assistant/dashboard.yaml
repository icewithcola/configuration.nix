# Installed as a YAML-mode Lovelace dashboard by the adjacent NixOS module.
# Keep the main views focused on daily controls and useful telemetry. Device
# configuration remains available from the entity's More info dialog.
title: "Kagura's home"
views:
  - title: 首页
    path: home
    icon: mdi:home-heart
    show_icon_and_title: true
    type: sections
    max_columns: 3
    header:
      layout: responsive
      badges_position: top
      card:
        type: markdown
        content: |
          ## ✨ Kagura's home
          设备控制、能耗与空气质量，一眼掌握。
    badges:
      - entity: sensor.zhimi_cn_977277023_rma3_temperature_p_3_7
        name: 温度
        icon: mdi:thermometer
        show_state: true
      - entity: sensor.zhimi_cn_977277023_rma3_relative_humidity_p_3_1
        name: 湿度
        icon: mdi:water-percent
        show_state: true
      - entity: sensor.zhimi_cn_977277023_rma3_pm2_5_density_p_3_4
        name: PM2.5
        icon: mdi:blur
        show_state: true
      - entity: sensor.dlx_cn_2026022406_deim01_electric_power_p_3_2
        name: 机柜功率
        icon: mdi:flash
        show_state: true
    sections:
      - type: grid
        background:
          color: "#EAF4FF"
          opacity: 60
        cards:
          - type: heading
            heading: 常用控制
            icon: mdi:gesture-tap-button
            badges:
              - type: entity
                entity: switch.dlx_cn_2025609472_deim02_on_p_2_1
                name: 空调插座
                show_state: true
              - type: entity
                entity: switch.zhimi_cn_977277023_rma3_on_p_2_1
                name: 空气净化器
                show_state: true
          - type: tile
            entity: switch.dlx_cn_2025609472_deim02_on_p_2_1
            name: 空调插座
            icon: mdi:power-socket-cn
            color: light-blue
            vertical: true
            tap_action:
              action: toggle
          - type: tile
            entity: switch.zhimi_cn_977277023_rma3_on_p_2_1
            name: 空气净化器
            icon: mdi:air-purifier
            color: cyan
            vertical: true
            tap_action:
              action: toggle
          - type: tile
            entity: light.dlx_cn_2025609472_deim02_s_10_indicator_light
            name: 插座指示灯
            icon: mdi:led-on
            color: light-blue
            vertical: true
            tap_action:
              action: toggle
          - type: conditional
            conditions:
              - condition: state
                entity: switch.zhimi_cn_977277023_rma3_on_p_2_1
                state: unavailable
            card:
              type: markdown
              content: >-
                **空气净化器当前离线。** 请先在小米米家中确认设备联网，
                再检查 Xiaomi Home 集成。

      - type: grid
        background:
          color: "#FFF4D9"
          opacity: 55
        cards:
          - type: heading
            heading: 能耗概览
            icon: mdi:lightning-bolt-circle
            badges:
              - type: entity
                entity: sensor.dlx_cn_2025609472_deim02_electric_power_p_3_2
                name: 空调插座
                show_state: true
              - type: entity
                entity: sensor.dlx_cn_2025609472_deim01_electric_power_p_3_2
                name: 机柜
                show_state: true
          - type: sensor
            entity: sensor.dlx_cn_2025609472_deim02_electric_power_p_3_2
            name: 空调插座功率
            icon: mdi:air-conditioner
            graph: line
            hours_to_show: 24
            detail: 2
          - type: sensor
            entity: sensor.dlx_cn_2026022406_deim01_electric_power_p_3_2
            name: 机柜功率
            icon: mdi:server
            graph: line
            hours_to_show: 24
            detail: 2
          - type: tile
            entity: sensor.air_conditioner_socket_monthly_energy
            name: 空调本月用电
            icon: mdi:calendar-month
            color: amber
          - type: tile
            entity: sensor.rack_monthly_energy
            name: 机柜本月用电
            icon: mdi:calendar-month
            color: orange

      - type: grid
        background:
          color: "#E8F7F2"
          opacity: 60
        cards:
          - type: heading
            heading: 卧室空气
            icon: mdi:leaf-circle
            badges:
              - type: entity
                entity: sensor.zhimi_cn_977277023_rma3_air_quality_p_3_8
                name: 空气质量
                show_state: true
              - type: entity
                entity: sensor.zhimi_cn_977277023_rma3_filter_life_level_p_4_1
                name: 滤芯
                show_state: true
          - type: tile
            entity: sensor.zhimi_cn_977277023_rma3_pm2_5_density_p_3_4
            name: PM2.5
            icon: mdi:blur
            color: light-blue
            vertical: true
          - type: tile
            entity: sensor.zhimi_cn_977277023_rma3_air_quality_p_3_8
            name: 空气质量
            icon: mdi:weather-hazy
            color: teal
            vertical: true
          - type: tile
            entity: sensor.zhimi_cn_977277023_rma3_temperature_p_3_7
            name: 温度
            icon: mdi:thermometer
            color: orange
            vertical: true
          - type: tile
            entity: sensor.zhimi_cn_977277023_rma3_relative_humidity_p_3_1
            name: 湿度
            icon: mdi:water-percent
            color: cyan
            vertical: true
          - type: tile
            entity: sensor.zhimi_cn_977277023_rma3_filter_life_level_p_4_1
            name: 滤芯寿命
            icon: mdi:air-filter
            color: green
            vertical: true

      - type: grid
        background:
          color: "#F2EEFF"
          opacity: 55
        cards:
          - type: heading
            heading: 设备健康
            icon: mdi:shield-check
            heading_style: subtitle
          - type: tile
            entity: sensor.dlx_cn_2026022406_deim01_fault_p_2_3
            name: 机柜状态
            icon: mdi:server-security
          - type: tile
            entity: sensor.dlx_cn_2025609472_deim02_fault_p_2_3
            name: 空调插座状态
            icon: mdi:power-plug-battery-outline

  - title: 卧室
    path: bedroom
